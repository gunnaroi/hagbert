name: check-secrets
# The core pipeline is keyless (PxWeb, NSDP SDMX, OECD, Eurostat), so this only
# guards against accidental secret commits later (email providers, APIs).
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
